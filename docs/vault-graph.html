<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafo del Vault</title>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --border: #2a2f3e;
    --text: #d4d8e3;
    --text-dim: #6b7280;
    --accent: #6c8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  svg { display: block; width: 100%; height: 100vh; }

  .controls {
    position: fixed;
    top: 16px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    z-index: 100;
    min-width: 220px;
    pointer-events: auto;
  }
  .controls h2 { font-size: 0.9rem; color: #fb923c; margin-bottom: 12px; }
  .controls .stat { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 3px 0; }
  .controls .stat .label { color: var(--text-dim); }
  .controls .stat .val { color: var(--accent); font-weight: 600; }
  .legend { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .legend h3 { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .legend-item {
    display: flex; align-items: center; gap: 8px; font-size: 0.72rem;
    padding: 3px 0; cursor: pointer; opacity: 0.8; transition: opacity 0.2s;
    user-select: none;
  }
  .legend-item:hover { opacity: 1; }
  .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-item.dimmed { opacity: 0.25; }

  .node-info {
    position: fixed; bottom: 16px; left: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 0; z-index: 100;
    width: 420px; max-height: 70vh; display: none; pointer-events: auto;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .node-info.visible { display: flex; }
  .node-info-header {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .node-info-header h3 { font-size: 0.9rem; color: var(--accent); margin-bottom: 4px; }
  .node-info-header .path { font-size: 0.72rem; color: var(--text-dim); word-break: break-all; }
  .node-info-header .links { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }
  .node-info-header .links span { color: #4ade80; }
  .node-info-content {
    padding: 14px 16px; overflow-y: auto; flex: 1;
    font-size: 0.78rem; line-height: 1.7; color: var(--text);
  }
  .node-info-content h1 { font-size: 1.1rem; color: var(--accent); margin: 0 0 8px; }
  .node-info-content h2 { font-size: 0.95rem; color: #fb923c; margin: 16px 0 8px; }
  .node-info-content h3 { font-size: 0.85rem; color: #4ecdc4; margin: 14px 0 6px; }
  .node-info-content h4 { font-size: 0.8rem; color: var(--text-dim); margin: 12px 0 4px; }
  .node-info-content p { margin: 6px 0; }
  .node-info-content ul, .node-info-content ol { padding-left: 18px; margin: 6px 0; }
  .node-info-content li { margin: 3px 0; }
  .node-info-content code {
    background: rgba(108,140,255,0.1); padding: 1px 5px; border-radius: 3px;
    font-size: 0.75rem; color: #22d3ee;
  }
  .node-info-content pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; font-size: 0.72rem; line-height: 1.5;
    margin: 8px 0; color: var(--text-dim);
  }
  .node-info-content strong { color: var(--text); }
  .node-info-content em { color: var(--text-dim); }
  .node-info-content blockquote {
    border-left: 3px solid var(--accent); padding-left: 10px;
    margin: 8px 0; color: var(--text-dim); font-style: italic;
  }
  .node-info-content table {
    width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.75rem;
  }
  .node-info-content th, .node-info-content td {
    padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border);
  }
  .node-info-content th { color: #fb923c; font-weight: 600; }
  .node-info-content hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .node-info-loading { color: var(--text-dim); padding: 20px; text-align: center; }

  .topbar {
    position: fixed; top: 16px; right: 16px;
    display: flex; gap: 8px; z-index: 100; pointer-events: auto;
  }
  .topbar a {
    padding: 8px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-dim); text-decoration: none;
    font-family: inherit; font-size: 0.75rem; transition: all 0.15s;
  }
  .topbar a:hover { color: var(--text); border-color: var(--accent); }

  .search {
    position: fixed; top: 16px; left: 260px; z-index: 100; pointer-events: auto;
  }
  .search input {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 6px;
    font-family: inherit; font-size: 0.8rem; outline: none; width: 220px;
  }
  .search input:focus { border-color: var(--accent); }

  .help {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; z-index: 100;
    font-size: 0.7rem; color: var(--text-dim); pointer-events: none;
  }
  .help kbd { background: var(--border); padding: 1px 5px; border-radius: 3px; font-size: 0.68rem; }
</style>
</head>
<body>

<svg id="graph"></svg>

<div class="controls">
  <h2>Grafo del Vault</h2>
  <div class="stat"><span class="label">Notas</span><span class="val" id="nodeCount">0</span></div>
  <div class="stat"><span class="label">Conexiones</span><span class="val" id="edgeCount">0</span></div>
  <div class="legend">
    <h3>Secciones</h3>
    <div id="legendItems"></div>
  </div>
</div>

<div class="search">
  <input type="text" id="searchInput" placeholder="Buscar nota..." />
</div>

<div class="topbar">
  <a href="/">Home</a>
  <a href="/arquitectura">Arquitectura</a>
  <a href="/auditoria">Auditoría</a>
</div>

<div class="node-info" id="nodeInfo">
  <div class="node-info-header">
    <h3 id="infoName"></h3>
    <div class="path" id="infoPath"></div>
    <div class="links" id="infoLinks"></div>
  </div>
  <div class="node-info-content" id="infoContent">
    <div class="node-info-loading">Cargando...</div>
  </div>
</div>

<div class="help">
  <kbd>Scroll</kbd> zoom &nbsp; <kbd>Arrastrar</kbd> mover nodo &nbsp; <kbd>Clic</kbd> ver info &nbsp; <kbd>Doble clic</kbd> centrar
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const COLORS = {
  '00 - Index': '#6c8cff',
  '01 - Setup': '#4ade80',
  '02 - Architecture': '#fb923c',
  '03 - Agents': '#a78bfa',
  '04 - Audio': '#22d3ee',
  '05 - Telemetry': '#f472b6',
  '06 - Code Reference': '#facc15',
  '07 - Decision Log': '#f87171',
  '08 - Roadmap': '#4ecdc4',
};

let graphData = { nodes: [], links: [] };
let selectedNode = null;
let searchTerm = '';
let hiddenCategories = new Set();

const svg = d3.select('#graph');
const width = window.innerWidth;
const height = window.innerHeight;

svg.attr('viewBox', [0, 0, width, height]);

const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.05, 4])
  .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

const linkGroup = g.append('g').attr('class', 'links');
const nodeGroup = g.append('g').attr('class', 'nodes');

let linkElements, nodeElements, labelElements;

async function init() {
  const res = await fetch('/api/vault/graph');
  graphData = await res.json();

  document.getElementById('nodeCount').textContent = graphData.nodes.length;
  document.getElementById('edgeCount').textContent = graphData.links.length;

  const cats = [...new Set(graphData.nodes.map(n => n.category))].sort();
  buildLegend(cats);

  const simulation = d3.forceSimulation(graphData.nodes)
    .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(140).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-400).distanceMax(600))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.size + 20))
    .force('x', d3.forceX(width / 2).strength(0.04))
    .force('y', d3.forceY(height / 2).strength(0.04))
    .on('tick', ticked);

  // Links
  linkElements = linkGroup.selectAll('line')
    .data(graphData.links)
    .join('line')
    .attr('stroke', '#1e2233')
    .attr('stroke-width', 1)
    .attr('stroke-opacity', 0.6);

  // Node groups
  const nodeG = nodeGroup.selectAll('g')
    .data(graphData.nodes)
    .join('g')
    .attr('class', 'node-group')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragged)
      .on('end', dragEnd));

  // Node circles
  nodeElements = nodeG.append('circle')
    .attr('r', d => d.size)
    .attr('fill', d => COLORS[d.category] || '#888')
    .attr('stroke', d => COLORS[d.category] || '#888')
    .attr('stroke-width', 1.5)
    .attr('stroke-opacity', 0.4);

  // Glow circles (behind)
  nodeG.insert('circle', 'circle')
    .attr('r', d => d.size + 6)
    .attr('fill', 'none')
    .attr('stroke', d => COLORS[d.category] || '#888')
    .attr('stroke-width', 2)
    .attr('stroke-opacity', 0)
    .attr('class', 'glow');

  // Labels
  labelElements = nodeG.append('text')
    .text(d => d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.size + 14)
    .attr('font-size', '11px')
    .attr('font-family', "'SF Mono', monospace")
    .attr('fill', '#d4d8e3')
    .attr('pointer-events', 'none')
    .attr('opacity', 0.9);

  // Click handler
  nodeG.on('click', (event, d) => {
    event.stopPropagation();
    selectNode(d);
  });

  // Double click to center
  nodeG.on('dblclick', (event, d) => {
    event.stopPropagation();
    const transform = d3.zoomTransform(svg.node());
    const x = width / 2 - d.x * transform.k;
    const y = height / 2 - d.y * transform.k;
    svg.transition().duration(600)
      .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(transform.k));
  });

  // Click on background to deselect
  svg.on('click', () => {
    selectedNode = null;
    updateHighlights();
    document.getElementById('nodeInfo').classList.remove('visible');
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase();
    updateHighlights();
  });

  // Legend toggles
  window.toggleCategory = (cat) => {
    if (hiddenCategories.has(cat)) hiddenCategories.delete(cat);
    else hiddenCategories.add(cat);
    document.querySelectorAll('.legend-item').forEach(el => {
      el.classList.toggle('dimmed', hiddenCategories.has(el.dataset.cat));
    });
    updateHighlights();
  };

  function ticked() {
    linkElements
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    nodeGroup.selectAll('.node-group')
      .attr('transform', d => `translate(${d.x},${d.y})`);
  }

  function dragStart(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }

  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }

  function dragEnd(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
}

function selectNode(node) {
  selectedNode = node;
  updateHighlights();
  showNodeInfo(node);
}

function updateHighlights() {
  const connectedIds = new Set();
  if (selectedNode) {
    connectedIds.add(selectedNode.id);
    graphData.links.forEach(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      if (sid === selectedNode.id) connectedIds.add(tid);
      if (tid === selectedNode.id) connectedIds.add(sid);
    });
  }

  // Nodes
  nodeGroup.selectAll('.node-group').each(function(d) {
    const el = d3.select(this);
    const hidden = hiddenCategories.has(d.category);
    const isSelected = selectedNode && d.id === selectedNode.id;
    const isConnected = selectedNode && connectedIds.has(d.id) && !isSelected;
    const isSearched = searchTerm && d.label.toLowerCase().includes(searchTerm);
    const dimmed = (selectedNode && !isSelected && !isConnected) || hidden;

    el.select('.glow')
      .attr('stroke-opacity', isSelected ? 0.5 : isConnected ? 0.2 : 0);

    el.select('circle:not(.glow)')
      .transition().duration(200)
      .attr('opacity', dimmed ? 0.15 : 1)
      .attr('stroke-width', isSelected ? 3 : isConnected ? 2.5 : 1.5)
      .attr('stroke-opacity', isSelected ? 0.8 : isConnected ? 0.5 : 0.4)
      .attr('r', isSelected ? d.size + 3 : isConnected ? d.size + 1 : d.size);

    el.select('text')
      .transition().duration(200)
      .attr('opacity', dimmed ? 0.1 : isSearched ? 1 : 0.9)
      .attr('font-weight', isSelected ? 'bold' : 'normal')
      .attr('font-size', isSelected ? '13px' : '11px');

    el.style('display', hidden ? 'none' : null);
  });

  // Links
  linkElements.each(function(d) {
    const el = d3.select(this);
    const sid = typeof d.source === 'object' ? d.source.id : d.source;
    const tid = typeof d.target === 'object' ? d.target.id : d.target;
    const sourceHidden = hiddenCategories.has(
      graphData.nodes.find(n => n.id === sid)?.category
    );
    const targetHidden = hiddenCategories.has(
      graphData.nodes.find(n => n.id === tid)?.category
    );
    const isHighlighted = selectedNode && (sid === selectedNode.id || tid === selectedNode.id);

    el.transition().duration(200)
      .attr('stroke', isHighlighted ? '#6c8cff' : '#1e2233')
      .attr('stroke-width', isHighlighted ? 2 : 1)
      .attr('stroke-opacity', (sourceHidden || targetHidden) ? 0 : isHighlighted ? 0.7 : 0.4);
  });
}

function showNodeInfo(node) {
  const linked = graphData.links
    .filter(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return sid === node.id || tid === node.id;
    })
    .map(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return sid === node.id
        ? graphData.nodes.find(n => n.id === tid)?.label
        : graphData.nodes.find(n => n.id === sid)?.label;
    });

  document.getElementById('infoName').textContent = node.label;
  document.getElementById('infoPath').textContent = node.path;
  document.getElementById('infoLinks').innerHTML = linked.length
    ? `<span>${linked.length} conexiones:</span> ${linked.join(', ')}`
    : 'Sin conexiones';
  document.getElementById('infoContent').innerHTML = '<div class="node-info-loading">Cargando...</div>';
  document.getElementById('nodeInfo').classList.add('visible');

  fetch(`/api/vault/note?path=${encodeURIComponent(node.path)}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('infoContent').innerHTML = renderMarkdown(data.content);
    })
    .catch(() => {
      document.getElementById('infoContent').innerHTML = '<div class="node-info-loading">Error al cargar</div>';
    });
}

function renderMarkdown(md) {
  if (!md) return '';
  let html = md;

  // Remove YAML frontmatter
  html = html.replace(/^---[\s\S]*?---\n*/m, '');

  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escapeHTML(code.trim())}</code></pre>`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Tables
  html = html.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)+)/gm, (_, header, sep, body) => {
    const ths = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
  });

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Wiki-links
  html = html.replace(/\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
    return `<strong style="color:#a78bfa">${label || target}</strong>`;
  });

  // Checkboxes
  html = html.replace(/^- \[x\] (.+)$/gm, '<li style="list-style:none">✅ $1</li>');
  html = html.replace(/^- \[ \] (.+)$/gm, '<li style="list-style:none">⬜ $1</li>');

  // Unordered lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');

  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Wrap consecutive <li> in <ul>
  html = html.replace(/((?:<li[^>]*>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Paragraphs (lines not starting with < and not empty)
  html = html.replace(/^(?!<[a-z/])((?!^$).+)$/gm, '<p>$1</p>');

  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');

  // Callouts > [!note]
  html = html.replace(/<blockquote>\[!(\w+)\]\s*(.+?)<\/blockquote>/g, (_, type, text) => {
    const colors = { note:'#6c8cff', warning:'#fb923c', important:'#f87171', decision:'#a78bfa' };
    const c = colors[type] || '#6c8cff';
    return `<div style="border-left:3px solid ${c};padding:6px 10px;margin:8px 0;background:rgba(255,255,255,0.03);border-radius:0 6px 6px 0;font-size:0.75rem"><strong style="color:${c}">${type.toUpperCase()}</strong><br>${text}</div>`;
  });

  return html;
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildLegend(cats) {
  document.getElementById('legendItems').innerHTML = cats.map(cat => {
    const color = COLORS[cat] || '#888';
    const count = graphData.nodes.filter(n => n.category === cat).length;
    return `<div class="legend-item" data-cat="${cat}" onclick="toggleCategory('${cat}')">
      <span class="dot" style="background:${color}"></span>
      <span>${cat} (${count})</span>
    </div>`;
  }).join('');
}

window.addEventListener('resize', () => {
  svg.attr('viewBox', [0, 0, window.innerWidth, window.innerHeight]);
});

init();
</script>
</body>
</html>
