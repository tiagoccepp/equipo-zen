abled\",\"account banned\",\"site down\",\"app not working\"],\"href\":\"/introduction/support-policy\"}]}]},{\"tab\":\"API Reference\",\"groups\":[{\"group\":\"Lovable API\",\"pages\":[{\"title\":\"API basics\",\"description\":\"All the basics to get started with the Lovable API.\",\"sidebarTitle\":\"Introduction\",\"keywords\":[\"Lovable API\",\"base URL\",\"rate limits\",\"pagination\",\"API Reference\"],\"href\":\"/api-reference/introduction\"},{\"title\":\"API changelog\",\"description\":\"Track stable versions and changes to the Lovable API.\",\"keywords\":[\"Lovable API changelog\",\"API versions\",\"stable version\",\"Lovable-Version\",\"API changes\"],\"href\":\"/api-reference/changelog\"},{\"group\":\"Endpoints\",\"pages\":[{\"group\":\"Workspaces\",\"pages\":[{\"title\":\"List workspaces\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns workspaces accessible to the authenticated client, with cursor pagination. Workspaces are ordered by join date, oldest first. A workspace-scoped API key returns only its workspace. Member details, including roles, are on GET /v1/workspaces/{workspace_id}/members. The num_projects count is eventually consistent and may not immediately reflect project creation or deletion.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces\",\"href\":\"/api-reference/workspaces/list-workspaces\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get workspace\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns workspace details, security and publishing policies, seat count, billing period, and default member credit limit. Usage fields are null without permission to view workspace usage. Member details, including roles, are on GET /v1/workspaces/{workspace_id}/members. The num_projects count is eventually consistent and may not immediately reflect project creation or deletion.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}\",\"href\":\"/api-reference/workspaces/get-workspace\",\"autogeneratedByOpenApi\":true},{\"title\":\"List workspace folders\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns the workspace's folders, sorted by name then id. Each project belongs to at most one folder; match a folder's id against the folder_id of GET /v1/projects and GET /v1/workspaces/{workspace_id}/security-center/insights/projects to group projects by folder, and filter either list with folder_id or is_in_folder. Restricted folders are returned only when the caller created them, was given access to them, or may manage every member's restricted folders. Reads are eventually consistent: recent changes may not appear immediately. Retry the read with backoff if an expected change is missing.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/folders\",\"href\":\"/api-reference/workspaces/list-workspace-folders\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Members \u0026 access\",\"pages\":[{\"title\":\"List project collaborators\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns users individually granted access to this project, with their access level. Access through groups, folders, or a workspace role is not listed, and the owner appears only when they also hold an explicit grant. Excludes pending invitations to email addresses without a Lovable account. Each user_id matches a user_id from GET /v1/workspaces/{workspace_id}/members, where users added only to projects have the role external_collaborator. A newly added collaborator may not appear there immediately.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/collaborators\",\"href\":\"/api-reference/members-access/list-project-collaborators\",\"autogeneratedByOpenApi\":true},{\"title\":\"List workspace groups\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns the workspace's groups, sorted by name. Use a group's id as the id of a type \\\"group\\\" audience_targets entry when publishing a project with audience \\\"custom\\\" via POST or PATCH /v1/projects/{project_id}/publish.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/groups\",\"href\":\"/api-reference/members-access/list-workspace-groups\",\"autogeneratedByOpenApi\":true},{\"title\":\"List workspace members\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns accepted workspace members with user_id, type, and name. The name is the stored display name, or null when unavailable. Filter with a repeated role, scim_managed=true|false, and query. Sort with sort_by plus sort_order; with a search query, results default to best matches first, otherwise they are ordered by role precedence, then most recently joined. Cursors are pinned to the filters and sort they were issued under; presenting one with different parameters returns 400. Reads are eventually consistent: recent changes may not appear immediately. Retry the read with backoff if an expected change is missing.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/members\",\"href\":\"/api-reference/members-access/list-workspace-members\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get workspace member\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns an active workspace member's profile and join and invitation dates. name is the stored display name, or null when unavailable. Pass the public user UUID returned as user_id by GET /v1/workspaces/{workspace_id}/members. Unknown users and missing or non-active memberships return 404. Reads are eventually consistent: recent changes may not appear immediately. Retry the read with backoff if an expected change is missing.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/members/{user_id}\",\"href\":\"/api-reference/members-access/get-workspace-member\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Projects\",\"pages\":[{\"title\":\"List projects\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns projects across the selected workspaces in one cursor-paginated list, sorted by last edited time descending then project ID ascending. Projects without a last edit use their update time for ordering; projects with neither sort last. Repeat workspace_id to select up to 10 workspaces. Every selected workspace must pass authorization; any failure rejects the whole request. Workspace-scoped API keys remain limited to their own workspace. Cursors are bound to the selected workspace set and filters. Reads are eventually consistent: recent changes may not appear immediately. Retry the read with backoff if an expected change is missing.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects\",\"href\":\"/api-reference/projects/list-projects\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get project\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns project details.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}\",\"href\":\"/api-reference/projects/get-project\",\"autogeneratedByOpenApi\":true},{\"title\":\"Delete project\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:write`\\n\\nDeletes a project. Where trash is available the project can be restored from the Lovable editor; otherwise the deletion is permanent and custom domains are disconnected immediately. Deleting a project that is already deleted returns 404 with type project_not_found, so a client retrying a delete whose outcome it does not know should treat that 404 as success.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest delete /v1/projects/{project_id}\",\"href\":\"/api-reference/projects/delete-project\",\"autogeneratedByOpenApi\":true},{\"title\":\"Update project\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:write`\\n\\nUpdates project sharing or the human-readable name. The description is generated by the agent and cannot be edited through this endpoint. Omitted fields keep their current values. This does not change access to the published app; use PATCH /v1/projects/{project_id}/publish for that.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest patch /v1/projects/{project_id}\",\"href\":\"/api-reference/projects/update-project\",\"autogeneratedByOpenApi\":true},{\"title\":\"Create embed URL\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:write`\\n\\nCreates a preview URL valid for one hour that can be loaded in an iframe on one exact HTTPS origin. Visitors do not need a Lovable login. It shows the project's built preview; it does not grant access to the editor or the published app.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest post /v1/projects/{project_id}/embed-url\",\"href\":\"/api-reference/projects/create-embed-url\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Deploy \u0026 domains\",\"pages\":[{\"title\":\"Publish project\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:write`\\n\\nBuilds and deploys the project. When the workspace blocks publishing on critical security findings, the quick security scan runs on the version being published first, and unresolved findings fail the request with 400 security_critical_findings. Returns 202 with the Deployment representation, status running, and null url and error fields; poll GET /v1/projects/{project_id}/publish/{deployment_id} until deployment finishes. Optionally set audience to choose who can open the published app; project reads report it as publish_audience. Omit audience to keep the current setting. Audience changes apply to the currently published version immediately, before the new deployment finishes. To change access settings without rebuilding, use PATCH /v1/projects/{project_id}/publish. To take the app offline, use DELETE /v1/projects/{project_id}/publish.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest post /v1/projects/{project_id}/publish\",\"href\":\"/api-reference/deploy-domains/publish-project\",\"autogeneratedByOpenApi\":true},{\"title\":\"Unpublish project\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:write`\\n\\nTakes the published app offline. Audience and visibility settings are retained and apply again on the next POST /v1/projects/{project_id}/publish. Returns 204 whether or not the app was online, so a repeated call is safe.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest delete /v1/projects/{project_id}/publish\",\"href\":\"/api-reference/deploy-domains/unpublish-project\",\"autogeneratedByOpenApi\":true},{\"title\":\"Update publish settings\",\"description\":\"$2e\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest patch /v1/projects/{project_id}/publish\",\"href\":\"/api-reference/deploy-domains/update-publish-settings\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get publish status\",\"description\":\"$2f\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/publish/{deployment_id}\",\"href\":\"/api-reference/deploy-domains/get-publish-status\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Security \u0026 governance\",\"pages\":[{\"title\":\"List personal data findings\",\"description\":\"**Plan:** `Enterprise`\\n\\n**Scope:** `projects:read`\\n\\nReturns findings of personally identifiable information (PII) in the project, newest first, including open, ignored, and fixed findings. Personal data detection must be enabled for the workspace; otherwise this endpoint returns 404.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/pii-labels\",\"href\":\"/api-reference/security-governance/list-personal-data-findings\",\"autogeneratedByOpenApi\":true},{\"title\":\"List security scans\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns the project's security scans ordered by start time, newest first. Use GET /v1/projects/{project_id}/security-scans/{scan_id}/findings to retrieve findings.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/security-scans\",\"href\":\"/api-reference/security-governance/list-security-scans\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get security scan\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns a security scan's status, timing, and requested checks. Findings are available from GET /v1/projects/{project_id}/security-scans/{scan_id}/findings.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/security-scans/{scan_id}\",\"href\":\"/api-reference/security-governance/get-security-scan\",\"autogeneratedByOpenApi\":true},{\"title\":\"List security scan findings\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns a page of findings in the scan snapshot, including results reused from earlier scans and findings marked fixed or ignored. Findings are ordered by scanner_name, ascending, with a stable order within each scanner. Follow pagination.next_cursor until pagination.has_more is false to retrieve the complete snapshot.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/security-scans/{scan_id}/findings\",\"href\":\"/api-reference/security-governance/list-security-scan-findings\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get workspace security insights\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nPrioritize security reviews across your workspace. Findings include public apps with security errors, unresolved personal data detections, projects shared with external collaborators, and projects whose owner is no longer an active workspace member.\\n\\nReturns workspace project and membership counts, project review priorities, and finding types with matching project counts. Requires Security Center access. The review_priority filter applies only to findings; summary counts remain workspace-wide. Finding types requiring personal data detection access are omitted when that feature is unavailable. Project and membership data is eventually consistent and may not immediately reflect recent changes.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/security-center/insights\",\"href\":\"/api-reference/security-governance/get-workspace-security-insights\",\"autogeneratedByOpenApi\":true},{\"title\":\"List workspace security project inventory\",\"description\":\"**Plan:** `Enterprise`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns workspace projects with review priorities, security finding counts, activity counts, and publishing details. Use GET /v1/projects/{project_id}/security-scans/{scan_id}/findings for individual findings. Supports search and filters. By default, projects are ordered by most recently edited, or search relevance when query is set. Project and membership data is eventually consistent and may not immediately reflect recent changes.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/security-center/insights/projects\",\"href\":\"/api-reference/security-governance/list-workspace-security-project-inventory\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Analytics\",\"pages\":[{\"title\":\"Get project analytics\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns website traffic for a published project over a date range as a time series. Date ranges are limited to 365 days, or 31 days with one-hour buckets. Some projects retain analytics for 90 days; older buckets are returned with zero values.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/analytics\",\"href\":\"/api-reference/analytics/get-project-analytics\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get project analytics breakdowns\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns the top pages, referring domains, device types, and visitor countries for a published project over a range of complete UTC calendar dates, up to 10 items each. Date ranges are limited to 365 days. Some projects retain analytics for 90 days; older days contribute no visitors.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/analytics/breakdowns\",\"href\":\"/api-reference/analytics/get-project-analytics-breakdowns\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get project realtime analytics\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `projects:read`\\n\\nReturns visitor counts for a published project over the last 30 minutes in one-minute buckets, plus the number of visitors active in the last 5 minutes.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/projects/{project_id}/analytics/realtime\",\"href\":\"/api-reference/analytics/get-project-realtime-analytics\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get workspace analytics\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns website traffic time series for the workspace, including historical traffic from projects that have since been deleted. The response covers the requested date range without pagination. Date ranges are limited to 365 days, or 31 days with hourly granularity.\",\"deprecated\":null,\"version\":null,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=rest get /v1/workspaces/{workspace_id}/analytics\",\"href\":\"/api-reference/analytics/get-workspace-analytics\",\"autogeneratedByOpenApi\":true}]}]},{\"group\":\"Early access\",\"pages\":[{\"group\":\"Credits\",\"pages\":[{\"title\":\"Get available credits\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns one workspace balance of remaining Lovable credits from subscriptions, top-ups, commitments, and bonuses. Excludes daily free credits, product allowances, and legacy Cloud/AI dollar wallets. The amount is an exact decimal string. Spending limits are reported separately and can still block usage.\",\"deprecated\":null,\"version\":null,\"groups\":[\"public-credits-api\",\"public-credits-api\"],\"noindex\":true,\"searchable\":false,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=flagged get /v1/workspaces/{workspace_id}/credits/balance\",\"href\":\"/api-reference/flagged/credits/get-available-credits\",\"autogeneratedByOpenApi\":true},{\"title\":\"List balance alerts\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nReturns workspace balance notifications, including disabled configured alerts. Threshold is either exact decimal credits or a percentage of eligible granted credits. Managed auto-top-up rules are excluded. Filters preserve the existing funding selection. Results are ordered by creation time descending, then ID descending; each page reflects current data.\",\"deprecated\":null,\"version\":null,\"groups\":[\"public-credits-api\",\"public-credits-api\"],\"noindex\":true,\"searchable\":false,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=flagged get /v1/workspaces/{workspace_id}/credits/balance/alerts\",\"href\":\"/api-reference/flagged/credits/list-balance-alerts\",\"autogeneratedByOpenApi\":true},{\"title\":\"Set a balance alert\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:write`\\n\\nCreates or updates a workspace balance alert with the same usage category and threshold. Threshold is exactly one positive decimal credits or percent value; percent supports two fractional digits from 0.01 to 99.99 and uses eligible granted credits as its denominator. Notifications fire on crossing down to or below the threshold. Email and in-app notifications are automatic; notification settings cannot be supplied. Optional filters select a usage category and exclude grant kinds or funding categories. Requires the credit-limit creation feature. Managed auto-top-up remains in billing settings. Balance alerts have no expiry; expires_at is invalid in writes. Returns 200. After a timeout, inspect the alerts collection before retrying; audit and evaluation side effects can repeat.\",\"deprecated\":null,\"version\":null,\"groups\":[\"public-credits-api\",\"public-credits-api\"],\"noindex\":true,\"searchable\":false,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=fla gregate usage endpoint. Amounts are exact decimal strings.\",\"deprecated\":null,\"version\":null,\"groups\":[\"public-credits-api\",\"public-credits-api\"],\"noindex\":true,\"searchable\":false,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=flagged get /v1/workspaces/{workspace_id}/credits/usage/projects\",\"href\":\"/api-reference/flagged/credits/list-credit-usage-by-project\",\"autogeneratedByOpenApi\":true},{\"title\":\"List credit usage by user\",\"description\":\"**Plan:** `Business or higher`\\n\\n**Scope:** `workspaces:read`\\n\\nLists workspace-wide per-user credit usage in a UTC date range. Sort by name or credits_used, ascending or descending, before cursor pagination; highest consumption is the default. Name sorting is case-insensitive and falls back to active-member email. Users without attributed usage are omitted; unavailable names and emails are null. The total includes unattributed usage without a synthetic user row. User and project filters are not supported. Requires permission to view member usage. Defaults to this month through today, with a maximum range of 366 days. Earlier runtime usage uses the same billing-model floor as the aggregate usage endpoint. Amounts are exact decimal strings.\",\"deprecated\":null,\"version\":null,\"groups\":[\"public-credits-api\",\"public-credits-api\"],\"noindex\":true,\"searchable\":false,\"openapi\":\"https://api.lovable.dev/v1/openapi.yaml?view=flagged get /v1/workspaces/{workspace_id}/credits/usage/users\",\"href\":\"/api-reference/flagged/credits/list-credit-usage-by-user\",\"autogeneratedByOpenApi\":true}]}]}]},{\"group\":\"Events \u0026 hooks\",\"pages\":[{\"title\":\"Events \u0026 hooks\",\"description\":\"Receive signed notifications when things happen in Lovable, or check actions before they proceed.\",\"keywords\":[\"webhooks\",\"webhook\",\"events\",\"hooks\",\"event notifications\",\"callback URL\"],\"href\":\"/api-reference/events-and-hooks\"},{\"group\":\"Reference\",\"pages\":[{\"grou
