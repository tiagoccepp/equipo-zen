<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Pablo — At your service</title>
  </head>
  <body>
    <div class="mesh" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Pablo</span>
        <span class="brand-sub">team</span>
      </div>
      <div class="conn" id="conn" role="status">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-text">Connecting</span>
      </div>
    </header>
    <main class="shell">
      <section class="stage">
        <div class="orbs" id="orbs" aria-hidden="true">
          <canvas id="orb-canvas"></canvas>
          <div class="orb-cells" id="orb-cells"></div>
        </div>
        <h1 class="greet" id="greet">Team console</h1>
        <p class="status" id="status">Connecting…</p>
      </section>

      <section class="composer">
        <textarea
          id="prompt"
          rows="2"
          placeholder="Type a message or instruction…"
          aria-label="Type a message or instruction"
        ></textarea>
        <div class="composer-actions">
          <div class="left">
            <button id="btn-mic" class="pill" type="button" aria-pressed="false" title="Talk to Pablo with your voice"><span class="pill-dot" aria-hidden="true"></span><span>Talk</span></button>
            <button id="btn-call" class="pill" type="button" aria-pressed="false" title="Let the whole team listen"><span class="pill-dot" aria-hidden="true"></span><span>Call all</span></button>
            <button id="btn-voice" class="pill on" type="button" aria-pressed="true" title="Spoken replies on/off"><span class="pill-dot" aria-hidden="true"></span><span>Voice</span></button>
            <button id="btn-autowork" class="pill on" type="button" aria-pressed="true" title="Agents keep working on the project on their own"><span class="pill-dot" aria-hidden="true"></span><span>Auto</span></button>
          </div>
          <button id="btn-send" class="send" type="button" aria-label="Send">Send</button>
        </div>
      </section>

      <section class="quick">
        <button class="chip" type="button" data-say="Please introduce yourselves.">Introduce team</button>
        <button class="chip" type="button" data-say="What is the team working on?">Work status</button>
        <button class="chip" type="button" id="btn-test-voice">Voice check</button>
      </section>

      <section class="stream-wrap">
        <div class="stream-head" aria-hidden="true"><span>Activity</span></div>
        <section class="stream" id="stream" aria-live="polite"><div class="stream-empty" id="stream-empty">No activity yet — messages and tool runs will appear here.</div></section>
      </section>

      <details class="companies">
        <summary>Companies</summary>
        <div id="companies-list"></div>
      </details>

      <details class="companies" id="perms-box" hidden>
        <summary>Computer permissions</summary>
        <div id="perms-list"></div>
      </details>

      <details class="companies" id="settings-box">
        <summary>Settings</summary>
        <div id="settings-list"></div>
      </details>
    </main>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
