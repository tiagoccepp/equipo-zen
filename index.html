<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sofia — a la orden</title>
  </head>
  <body>
    <div class="mesh" aria-hidden="true"></div>
    <main class="shell">
      <section class="stage">
        <div class="orbs" id="orbs" aria-hidden="true">
          <canvas id="orb-canvas"></canvas>
          <div class="orb-cells" id="orb-cells"></div>
        </div>
        <h1 class="greet" id="greet">¿En qué te ayudo, señor?</h1>
        <p class="status" id="status">conectando…</p>
      </section>

      <section class="composer">
        <textarea
          id="prompt"
          rows="2"
          placeholder="Pedile algo a Sofia…"
          aria-label="Pedile algo a Sofia"
        ></textarea>
        <div class="composer-actions">
          <div class="left">
            <button id="btn-mic" class="pill" type="button" aria-pressed="false">🎤 hablar</button>
            <button id="btn-call" class="pill" type="button" aria-pressed="false">📞 llamar a todos</button>
            <button id="btn-voice" class="pill on" type="button" aria-pressed="true">🔊 voz</button>
            <button id="btn-autowork" class="pill on" type="button" aria-pressed="true" title="Los agentes laburan solos en el proyecto">⚙️ auto</button>
          </div>
          <button id="btn-send" class="send" type="button" aria-label="Enviar">↑</button>
        </div>
      </section>

      <section class="quick">
        <button class="chip" type="button" data-say="Preséntense, por favor.">Preséntense</button>
        <button class="chip" type="button" data-say="¿En qué anda el equipo?">¿En qué andan?</button>
        <button class="chip" type="button" id="btn-test-voice">Probar voz</button>
      </section>

      <section class="stream" id="stream" aria-live="polite"></section>

      <details class="companies">
        <summary>Empresas</summary>
        <div id="companies-list"></div>
      </details>

      <details class="companies" id="perms-box" hidden>
        <summary>Permisos de computadora</summary>
        <div id="perms-list"></div>
      </details>
    </main>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
