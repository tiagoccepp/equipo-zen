<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orb</title>
    <style>
      /* Mini ventana: tarjeta glass oscura con el mismo OrbField vivo.
         Ventana 200x264 (ver ORB_W/H en Rust): la tarjeta respira 6px. */
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: transparent;
        font-family: "Inter Tight", "Sora", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        padding: 6px;
        user-select: none; -webkit-user-select: none;
      }
      .orb-card {
        position: relative;
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 2px;
        border-radius: 26px;
        overflow: hidden;
        cursor: pointer;
        background: linear-gradient(180deg, rgba(38,38,40,0.66), rgba(12,12,14,0.74));
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
        backdrop-filter: blur(22px) saturate(1.35);
        border: 1px solid rgba(255,255,255,0.13);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.14),
          inset 0 -1px 0 rgba(0,0,0,0.4),
          0 18px 44px rgba(0,0,0,0.55),
          0 0 34px rgba(253,73,168,0.10);
      }
      /* Mesh tenue dentro del vidrio: rosa arriba, peri abajo. */
      .orb-card::before {
        content: "";
        position: absolute; inset: 0;
        pointer-events: none;
        background:
          radial-gradient(120px 90px at 18% 6%, rgba(253,73,168,0.20), transparent 70%),
          radial-gradient(130px 100px at 85% 95%, rgba(116,145,255,0.18), transparent 70%),
          radial-gradient(90px 70px at 80% 12%, rgba(244,191,117,0.08), transparent 70%);
      }
      .orb-card > * { position: relative; z-index: 1; }
      #orb-canvas {
        width: 148px; height: 148px;
        filter: drop-shadow(0 4px 18px rgba(0,0,0,0.5));
      }
      .status {
        font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px; letter-spacing: 0.16em;
        color: rgba(245,244,239,0.85);
        text-transform: uppercase;
        min-height: 14px; text-align: center;
        pointer-events: none;
      }
      .status .dot {
        color: #fd49a8;
      }
      .row {
        display: flex; gap: 10px; margin-top: 6px;
      }
      /* Píldoras táctiles: insets layerados, firma Lovable. */
      .btn {
        appearance: none; cursor: pointer;
        min-width: 62px; height: 38px; border-radius: 19px;
        padding: 0 16px;
        border: 1px solid rgba(255,255,255,0.16);
        background: linear-gradient(180deg, #3a3a3e, #262628 60%, #1c1c1e);
        color: #f5f4ef; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.25),
          inset 0 -2px 4px rgba(0,0,0,0.5),
          0 4px 12px rgba(0,0,0,0.45);
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
      }
      .btn:hover { border-color: rgba(253,73,168,0.6); }
      .btn:active { transform: translateY(1px); }
      .btn:focus-visible {
        outline: 2px solid #fd49a8;
        outline-offset: 2px;
      }
      .btn.live {
        border-color: #fd49a8; color: #ffd3e8;
        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.25),
          inset 0 -2px 4px rgba(120,10,70,0.5),
          0 0 18px rgba(253,73,168,0.5);
      }
      @media (prefers-reduced-motion: reduce) {
        .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="orb-card" id="orb-card">
      <canvas id="orb-canvas"></canvas>
      <div class="status" id="orb-status">Pablo</div>
      <div class="row">
        <button class="btn" id="micBtn" aria-label="Talk">🎤</button>
        <button class="btn" id="expandBtn" aria-label="Open Pablo">⤢</button>
      </div>
    </div>
    <script type="module" src="/src/orb.ts"></script>
  </body>
</html>
