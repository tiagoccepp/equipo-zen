<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbe</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: transparent;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none;
      }
      /* Esfera de llamada flotante: sin card, como el modo llamada. */
      #orb-canvas {
        width: 176px; height: 176px; cursor: pointer;
        filter: drop-shadow(0 6px 24px rgba(0,0,0,0.55));
      }
      .status {
        margin-top: 2px;
        font-family: ui-monospace, monospace;
        font-size: 11px; letter-spacing: 0.1em;
        color: rgba(245,244,239,0.9);
        text-transform: uppercase;
        text-shadow: 0 1px 6px rgba(0,0,0,0.9);
        min-height: 14px; text-align: center;
        pointer-events: none;
      }
      .row {
        display: flex; gap: 10px; margin-top: 6px;
      }
      .btn {
        appearance: none; cursor: pointer;
        width: 40px; height: 40px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.25);
        background: rgba(10,10,10,0.6);
        backdrop-filter: blur(8px);
        color: #f5f4ef; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
      }
      .btn:hover { border-color: #fd49a8; }
      .btn.live {
        border-color: #fd49a8; color: #ffd3e8;
        box-shadow: 0 0 16px rgba(253,73,168,0.45);
      }
    </style>
  </head>
  <body>
    <canvas id="orb-canvas"></canvas>
    <div class="status" id="orb-status">sofia</div>
    <div class="row">
      <button class="btn" id="micBtn" aria-label="Hablar">🎤</button>
      <button class="btn" id="expandBtn" aria-label="Abrir Sofia">⤢</button>
    </div>
    <script type="module" src="/src/orb.ts"></script>
  </body>
</html>
