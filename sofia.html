<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04070c" />
    <title>Sofia — a la orden</title>
    <style>
      /* Empresas: panel flotante mínimo (el resto del HUD es shell.css lyns). */
      #empresas-layer { position: fixed; top: 64px; right: 16px; z-index: 40; }
      .emp-panel { width: 300px; background: rgba(4, 10, 16, 0.92); border: 1px solid #164e63;
        border-radius: 8px; font-family: ui-monospace, monospace; color: #a5f3fc; }
      .emp-head { padding: 8px 12px; border-bottom: 1px solid #164e63; font-size: 12px;
        letter-spacing: 2px; display: flex; justify-content: space-between; }
      .emp-head button { background: none; border: none; color: #67e8f9; cursor: pointer; font-size: 14px; }
      .emp-item { display: block; width: 100%; text-align: left; background: none; border: none;
        border-bottom: 1px solid #0e3744; color: #cffafe; padding: 10px 12px; cursor: pointer;
        font: inherit; font-size: 13px; }
      .emp-item:hover, .emp-item.active { background: rgba(34, 211, 238, 0.12); }
      .emp-new { color: #67e8f9 !important; }
    </style>
  </head>
  <body class="q-app">
    <div id="avatar-root"></div>

    <div class="session-strip">
      <span class="ss-item"><span class="ss-label">SOFIA</span> <span id="hud-state">a la orden</span></span>
      <span class="ss-divider"></span>
      <span class="ss-item"><span class="ss-label">TURNOS</span> <span id="hud-turns">0</span></span>
      <span class="ss-item"><span class="ss-label">UP</span> <span id="hud-uptime">0:00</span></span>
      <span class="ss-divider"></span>
      <span class="ss-item ss-activity"><span class="ss-label">ACT</span> <span id="hud-activity">idle</span></span>
    </div>

    <div class="hud-bar">
      <button id="llamar-btn">llamar a todos</button>
      <button id="charla-btn">charla</button>
      <button id="empresas-btn">empresas</button>
    </div>

    <main class="stage">
      <aside class="col col-left" aria-label="Transcripción">
        <section class="panel panel-transcript">
          <header class="panel-head">
            <span class="led"></span><span class="led"></span><span class="led"></span>
            <span class="panel-title">Transcript</span>
          </header>
          <div id="hud-transcript" class="transcript" aria-live="polite">
            <div class="t-empty">a la orden…</div>
          </div>
        </section>
      </aside>
      <div class="col-center" aria-hidden="true"></div>
      <aside class="col col-right" aria-label="Telemetría"></aside>
      <footer class="stage-footer">
        <button id="mic-fab" class="mic-button" type="button" aria-label="Tocá para hablar">
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" />
            <path class="mic-stem" d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" />
          </svg>
          <span class="mic-label">TOCÁ PARA HABLAR</span>
        </button>
        <svg id="hud-wave" class="mic-wave" viewBox="0 0 240 64" preserveAspectRatio="none" aria-hidden="true">
          <line class="wave-axis" x1="0" y1="61" x2="240" y2="61" />
        </svg>
      </footer>
    </main>

    <div id="session-layer" class="terminal-layer"></div>
    <div id="empresas-layer" hidden></div>
    <div id="caption" class="caption" aria-live="polite"></div>
    <div id="status" class="status"></div>

    <script type="module" src="/src/sofia/main.ts"></script>
  </body>
</html>
